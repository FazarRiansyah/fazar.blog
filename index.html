<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fazar.site | Under Construction</title>
    <meta name="description" content="Website fazar.site sedang dalam pengembangan. Kembali lagi nanti untuk melihat pembaruan terbaru.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Elements -->
    <div class="glow-bg">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="container">
        <div class="glass-card">
            <!-- Status Badge -->
            <div class="status-badge">
                <span class="pulse-dot"></span>
                <span class="status-text">Sedang Diperbarui</span>
            </div>

            <!-- Site Branding / Title -->
            <header class="header">
                <h1 class="logo">fazar<span>.site</span></h1>
            </header>

            <!-- Main Content -->
            <section class="content">
                <h2>Website sedang dalam pengembangan</h2>
                <p>Kami sedang menyiapkan sesuatu yang luar biasa untuk Anda. Desain dan fitur baru akan segera hadir.</p>
            </section>

            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-label">
                    <span>Progress Pengembangan</span>
                    <span id="progress-percent">75%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: 75%;"></div>
                </div>
            </div>

            <!-- Newsletter / Contact -->
            <div class="contact-section">
                <p class="contact-hint">Ada pertanyaan? Hubungi saya di:</p>
                <a href="mailto:contact@fazar.site" class="btn-email">
                    <i class="fa-regular fa-envelope"></i> contact@fazar.site
                </a>
            </div>

            <!-- Footer & Socials -->
            <footer class="footer">
                <div class="social-links">
                    <a href="https://github.com" target="_blank" aria-label="GitHub" class="social-icon">
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn" class="social-icon">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                    <a href="https://instagram.com" target="_blank" aria-label="Instagram" class="social-icon">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                </div>
                <p class="copyright">&copy; 2026 fazar.site. All rights reserved.</p>
            </footer>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
